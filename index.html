<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The English Cinema</title>
<style>
:root{--g:#e3b23c;--c:#f6ecd2;--k:#120508;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}body{margin:0;background:radial-gradient(#3a0a14,#120508);color:var(--c);font-family:Georgia,"Times New Roman",serif;min-height:100vh;font-size:1.15rem}
.scr{display:none;padding:14px;max-width:1250px;margin:auto}.scr.on{display:block;animation:f .5s}@keyframes f{from{opacity:0;transform:scale(.97)}}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--g);text-shadow:0 0 16px #e3b23c77;text-align:center;margin:.4em 0}h1{font-size:clamp(2.2rem,8vw,5rem);letter-spacing:.08em}
button{font:inherit;font-weight:bold;font-size:1.2rem;background:linear-gradient(var(--g),#b8841c);color:#2a0a10;border:0;border-radius:12px;padding:14px 22px;margin:6px;cursor:pointer;min-height:52px}button:hover{filter:brightness(1.15)}button:disabled{opacity:.35;cursor:default}
.c{text-align:center}.card{background:#2a0a12;border:2px solid var(--g);border-radius:16px;padding:16px;margin:10px auto;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.lights{height:16px;background:repeating-radial-gradient(circle at 12px 8px,#ffe9a0 0 5px,transparent 6px 28px);animation:bl 1s infinite alternate}@keyframes bl{to{opacity:.35}}
#cur{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex}#cur i{flex:1;background:repeating-linear-gradient(90deg,#7a1020 0 22px,#4d0914 22px 44px);transition:transform .6s}#cur.o i:first-child{transform:translateX(-101%)}#cur.o i:last-child{transform:translateX(101%)}
#bar{display:none;position:sticky;top:0;z-index:20;background:#120508ee;justify-content:center;flex-wrap:wrap;border-bottom:2px solid var(--g)}#bar button{font-size:1rem;padding:8px 14px;min-height:40px}
#m{position:fixed;inset:0;background:#000d;z-index:40;display:none;overflow:auto;padding:4vh 12px}#m.on{display:block}
.door{background:linear-gradient(#5a0f1e,#2a0710);border:3px solid var(--g);border-radius:90px 90px 14px 14px;padding:18px;text-align:center;box-shadow:0 0 20px #e3b23c44}.door.d{box-shadow:0 0 30px #7dff9a}.ill{font-size:4rem}.tk{color:#7dff9a;font-size:1.4rem}
.prog{height:18px;max-width:500px;margin:8px auto 16px;background:#000;border:2px solid var(--g);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g);transition:width .6s}
.emo{font-size:clamp(3rem,12vw,6rem)}.poster{margin:12px auto;max-width:300px;padding:18px;border:4px solid var(--g);border-radius:8px;display:flex;flex-direction:column;gap:8px;animation:f .6s}.poster b{font-size:1.7rem}.poster span{font-size:2.5rem}.big{font-size:4rem;color:var(--g);text-align:center}
.q{font-size:1.5rem}.opt{display:block;width:100%;text-align:left;background:#3d1220;color:var(--c);border:2px solid var(--g)}.opt.s{outline:4px solid #fff}.opt.ok{background:#1f7a3a}.opt.bad{background:#a01b2b}
.tf button{min-width:110px}.tf .s{outline:4px solid #fff}.tf .ok{background:#1f7a3a;color:#fff}.tf .bad{background:#a01b2b;color:#fff}
.bag{background:linear-gradient(135deg,#d62839,#7a0f1e);border:4px solid var(--g);border-radius:20px 20px 60px 60px;padding:34px 16px;margin:10px auto;max-width:900px;text-align:center}.chips{display:flex;flex-wrap:wrap;justify-content:center}
.chip{width:78px;height:78px;border-radius:50%;background:#f6c453;font-size:1.6rem;padding:0}.chip.g{background:#4caf6a}.chip.w{background:#999}
.sb{display:flex;gap:10px;position:sticky;top:50px;z-index:10;background:#120508ee;padding:6px}.tm{flex:1;border:2px solid var(--g);border-radius:12px;text-align:center;padding:6px}.tm span{display:block;font-size:2.2rem;color:var(--g)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:10px}.row{display:flex;justify-content:center}.row button{flex:1;padding:12px 4px;margin:4px}.ans{font-size:2rem;color:#7dff9a;margin:14px 0}
textarea{width:100%;font:inherit;font-size:1.2rem;border-radius:10px;padding:10px}.cf span{position:fixed;top:-8vh;font-size:2rem;animation:fall 3.5s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style></head><body>
<div id="cur" class="o"><i></i><i></i></div><div id="m"></div>
<div id="bar"><button onclick="go('lobby')">🏠 LOBBY</button><button id="sb" onclick="tgl()">🔊 SOUND ON</button><button onclick="rq()">↺ RESET GAME</button></div>
<div id="s0" class="scr on c"><div class="lights"></div><div style="margin-top:12vh"><p>🎞️ 🍿 🎟️</p><h1>THE ENGLISH CINEMA</h1><h2>Entertainment &amp; Media</h2><h3>Grade 8</h3><button style="font-size:2.2rem;padding:24px 60px;margin-top:30px;box-shadow:0 0 40px var(--g);animation:bl 1s infinite alternate" onclick="start()">▶ START</button></div></div>
<div id="lobby" class="scr"></div><div id="r1" class="scr"></div><div id="r2" class="scr"></div><div id="r3" class="scr"></div><div id="r4" class="scr"></div><div id="r5" class="scr"></div>
<script>
const $=s=>document.querySelector(s);let A,snd=true,done={},i1,s1,st1,a2,ck2,st3,sel,lock,a5,cur;
function tn(f,d=.3,t="sine",v=.2,s=0){if(!A||!snd)return;const o=A.createOscillator(),g=A.createGain(),n=A.currentTime+s;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(A.destination);o.start(n);o.stop(n+d)}
const bell=()=>{tn(1318,1.2);tn(1760,1,"sine",.1)},ok=()=>{tn(660,.15);tn(880,.3,"sine",.2,.12)},no=()=>tn(180,.4,"sawtooth",.15),proj=()=>{tn(60,.6,"sawtooth",.08);tn(95,.6,"square",.04)},fan=()=>[523,659,784,1047,784,1047].forEach((f,i)=>tn(f,.35,"square",.1,i*.18));
function clap(){if(!A||!snd)return;for(let i=0;i<30;i++){const n=A.sampleRate*.05,b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);for(let j=0;j<n;j++)d[j]=(Math.random()*2-1)*(1-j/n);const s=A.createBufferSource(),g=A.createGain();g.gain.value=.25;s.buffer=b;s.connect(g);g.connect(A.destination);s.start(A.currentTime+Math.random()*2.5)}}
function tgl(){snd=!snd;$("#sb").textContent=snd?"🔊 SOUND ON":"🔇 SOUND OFF"}
function modal(h){$("#m").innerHTML='<div class="card" style="max-width:900px">'+h+'</div>';$("#m").classList.add("on")}
function shut(){$("#m").classList.remove("on")}
const INIT={lobby:lobby,r1:()=>i1===undefined?r1i():r1d(),r2:()=>a2||r2i()||0,r3:()=>st3?r3d():r3i(),r4:board,r5:()=>a5?r5d():r5i()};
function go(id){const c=$("#cur");c.classList.remove("o");speechSynthesis.cancel();setTimeout(()=>{document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));$("#"+id).classList.add("on");$("#bar").style.display="flex";window.scrollTo(0,0);if(INIT[id])INIT[id]();c.classList.add("o")},650)}
function start(){A=new (window.AudioContext||window.webkitAudioContext)();bell();proj();fan();go("lobby")}
function enter(n){bell();if(n<3)proj();go("r"+n)}
function finish(n){done[n]=1}
const RN=[["Guess the Movie","🎬"],["Listening Cinema","🎧"],["Snack Bar","🍿"],["Movie Challenge","🏆"],["Final Scene","🎞️"]];
function lobby(){const n=Object.keys(done).length;$("#lobby").innerHTML=`<div class="lights"></div><h2>The Cinema Lobby</h2><p class="c">🎟️ Rooms completed: ${n} / 5</p><div class="prog"><i style="width:${n*20}%"></i></div><div class="grid">${RN.map((r,i)=>`<div class="door ${done[i+1]?"d":""}"><small>ROOM ${i+1}</small><div class="ill">${r[1]}</div><h3>${r[0]}</h3>${done[i+1]?'<div class="tk">🎟️ ✔ Completed</div>':""}<button onclick="enter(${i+1})">ENTER</button></div>`).join("")}</div>`}
function rq(){modal('<h2>Reset the whole game?</h2><p>All scores and progress will be deleted.</p><button onclick="reset()">YES, RESET</button><button onclick="shut()">NO, GO BACK</button>')}
function reset(){T.forEach(t=>t[1]=0);used={};i1=st3=a2=a5=undefined;done={};shut();go("lobby")}
/* ROOM 1 */
const R1=[["🎪🐘","Dumbo","#c0392b"],["🎸💀🌸","Coco","#e67e22"],["🐱🐭","Tom and Jerry","#2980b9"],["🐠🐚🪸🐡🧜‍♀️","The Little Mermaid","#16a085"],["🐰🦊🚔","Zootopia","#8e44ad"]];
function r1i(){i1=0;s1=0;st1=0;r1d()}
function r1d(){const c=$("#r1");if(i1>=5){c.innerHTML=`<h2>Room 1 — Final score</h2><div class="big">${s1} / 5</div><div class="c"><button onclick="r1i()">↺ PLAY AGAIN</button><button onclick="go('lobby')">🏠 LOBBY</button></div>`;finish(1);return}
const [e,t,col]=R1[i1];c.innerHTML=`<h2>Room 1 — Guess the Movie</h2><p class="c">Card ${i1+1} of 5 • Score: ${s1}</p><div class="card"><div class="emo">${e}</div>${st1?`<div class="poster" style="background:linear-gradient(${col},#120508)"><small>NOW SHOWING</small><b>${t}</b><span>${e}</span></div>`:"<p>Discuss with your team. What is the movie?</p>"}</div><div class="c">${st1==0?'<button onclick="st1=1;ok();r1d()">👁 REVEAL ANSWER</button>':""}${st1==1?'<button onclick="rec(1)">✔ We got it (+1)</button><button onclick="rec(0)">✖ Not this time</button>':""}<button ${st1==2?"":"disabled"} onclick="i1++;st1=0;r1d()">NEXT ▶</button></div>`}
function rec(v){if(st1!=1)return;st1=2;if(v){s1++;ok()}else no();r1d()}
/* ROOM 2 */
const SC="Hi! My name is Daniel, and I’m 14 years old. I really enjoy entertainment in my free time. My favourite activity is watching films, especially adventure and comedy films. I usually watch movies with my younger sister at weekends.\n\nI also love listening to music. My favourite singer is a pop artist, but I sometimes listen to rock music too. I don’t spend much time watching television because I think online videos are more interesting.\n\nLast Saturday, I watched a documentary about animals. It was very interesting because I learned many new facts about wild animals. My sister wanted to watch a cartoon, but we decided to watch it on Sunday instead.\n\nI also use social media, but I try not to spend too much time online. I think entertainment is important because it helps us relax after a busy day.";
const Q2=[["Daniel is 14 years old.",1],["His favourite activity is playing computer games.",0],["He usually watches films with his younger sister.",1],["He enjoys adventure and comedy films.",1],["Last Saturday, Daniel watched a documentary about sea animals.",0],["His sister wanted to watch a cartoon.",1],["Daniel thinks entertainment helps people relax after a busy day.",1]];
function r2i(){a2=Array(7).fill(-1);ck2=0;r2d()}
function say(){proj();if(speechSynthesis.paused){speechSynthesis.resume();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SC);u.lang="en-GB";u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function rep(){speechSynthesis.cancel();setTimeout(say,200)}
function pk(i,v){if(ck2)return;a2[i]=v;r2d()}
function r2d(){const sc=a2.filter((a,i)=>a==Q2[i][1]).length;$("#r2").innerHTML=`<h2>Room 2 — Listening Cinema</h2><div class="card"><p>🎧 Listen to Daniel. Then choose TRUE or FALSE.</p><button onclick="say()">▶ PLAY</button><button onclick="speechSynthesis.pause()">⏸ PAUSE</button><button onclick="rep()">↺ REPLAY</button></div>${Q2.map((q,i)=>`<div class="card tf"><p class="q">${i+1}. ${q[0]}</p>${[1,0].map(v=>`<button class="${a2[i]==v?"s":""} ${ck2&&v==q[1]?"ok":""} ${ck2&&a2[i]==v&&v!=q[1]?"bad":""}" onclick="pk(${i},${v})">${v?"TRUE":"FALSE"}</button>`).join("")}${ck2?(a2[i]==q[1]?" ✔":" ✖ Answer: "+(q[1]?"TRUE":"FALSE")):""}</div>`).join("")}<div class="c">${ck2?`<div class="big">${sc} / 7</div><button onclick="r2i()">↺ TRY AGAIN</button>`:'<button onclick="chk2()">CHECK ANSWERS</button>'}<button onclick="go('lobby')">🏠 LOBBY</button></div>`}
function chk2(){if(a2.includes(-1)){alert("Please answer all 7 questions.");return}ck2=1;finish(2);a2.filter((a,i)=>a==Q2[i][1]).length>=5?(ok(),fan()):no();r2d()}
/* ROOM 3 */
const Q3=[
["What is the difference between a film and a TV series?",["A film has episodes, but a series doesn’t.","A series has episodes, but a film is usually one complete story.","They are exactly the same."],1],
["You watch a programme where people cook, dance or compete to win a prize. What is it?",["Documentary","Reality show","News programme"],1],
["What does a film director do?",["Directs how a film is made.","Sells tickets at the cinema.","Writes reviews after watching films."],0],
["Why do people use subtitles when watching films?",["To make the film shorter.","To read what the characters are saying.","To change the ending."],1],
["What is a spoiler?",["A short film trailer.","Important information that reveals part of the story.","A person who acts in a film."],1],
["Which of these is an example of fake news?",["A newspaper reports information from reliable sources.","A website publishes a made-up story and presents it as real news.","A journalist interviews a witness."],1],
["What do we call a short video that shows scenes from an upcoming film?",["Trailer","Episode","Review"],0],
["Why might a director use background music in a scary scene?",["To create tension and make viewers feel nervous.","To help actors remember their lines.","To make the scene shorter."],0],
["What is the main purpose of an advertisement?",["To sell or promote a product or service.","To tell the ending of a film.","To report the weather."],0],
["What is a podcast?",["An audio programme that people can listen to online.","A type of cinema ticket.","A printed newspaper."],0],
["If a film is described as a sequel, what does it mean?",["It is a film that continues an earlier story.","It is a film with no actors.","It is a film about real events only."],0],
["What is the difference between a fact and an opinion?",["A fact can be checked, while an opinion expresses someone’s view.","A fact is always funny.","An opinion is always correct."],0],
["Which person is responsible for writing the dialogue and story of a film?",["Screenwriter","Cameraman","Sound engineer"],0],
["What does it mean when a film goes viral?",["It becomes very popular and spreads quickly online.","It is removed from every website.","It is only shown in cinemas."],0],
["Why should we check information before sharing it on social media?",["To make our posts longer.","To avoid spreading false information.","To get more followers."],1],
["What is a documentary usually about?",["Imaginary superheroes.","Real people, events or topics.","Magical animals only."],1],
["You read a text about a film that tells you whether it is good or bad. What is it?",["Review","Advertisement","Trailer"],0],
["What is binge-watching?",["Watching several episodes of a series one after another.","Watching a film without sound.","Watching only the final episode."],0],
["A famous actor appears in a film for only a few seconds. What is this called?",["A cameo","A sequel","A soundtrack"],0],
["Imagine you are a film producer. You have a small budget. What would you spend money on first: actors, costumes, music or special effects? Why?"]];
